      .detail { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .branch { fill: none; stroke-width: 5; stroke-linecap: round; }
      .child-line { fill: none; stroke-width: 2.5; stroke-linecap: round; }
      .main-box { stroke-width: 2; }
      .child-box { stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="2400" height="1800" fill="#fffdfb"/>

  <!-- root to main branches -->
  <path class="branch" stroke="#5b38a5" d="M300 875 C330 875 290 100 350 100"/>
  <path class="branch" stroke="#5b38a5" d="M300 875 C340 875 300 320 350 320"/>
