  <path class="branch" stroke="#5b38a5" d="M300 875 C350 875 300 980 350 980"/>
  <path class="branch" stroke="#5b38a5" d="M300 875 C350 875 300 1200 350 1200"/>
  <path class="branch" stroke="#5b38a5" d="M300 875 C350 875 300 1420 350 1420"/>
