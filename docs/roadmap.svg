  <g>
    <rect class="main-box" x="350" y="1610" width="180" height="60" rx="14" fill="#d9d4cf" stroke="#89817a"/>
    <text class="main" x="440" y="1648" text-anchor="middle" fill="#5d5650">项目路线</text>
