# CI/CD：测试 →（仅 main push）在 Actions 构建镜像，经 SSH 传到服务器 docker load（服务器无需访问 GHCR）
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: go-demo:latest

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: awesome_project
          MYSQL_USER: app
          MYSQL_PASSWORD: app123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      MYSQL_DSN: app:app123@tcp(127.0.0.1:3306)/awesome_project?charset=utf8mb4&parseTime=true&loc=UTC
      JWT_SECRET: ci-jwt-secret
      REDIS_ADDR: 127.0.0.1:6379
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Apply migrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mysql-client
          for f in migrations/*.sql; do
            echo "apply $f"
            mysql -h127.0.0.1 -P3306 -uapp -papp123 awesome_project < "$f"
          done

      - name: Verify modules
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE" -f Dockerfile .

      - name: Save image tarball
        run: docker save "$IMAGE" -o go-demo.tar

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          # 去掉 Windows 粘贴可能带入的 CR；私钥必须是 BEGIN.*PRIVATE KEY 那段
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/deploy_key; then
            echo "DEPLOY_SSH_KEY does not look like a private key (missing BEGIN PRIVATE KEY)"
            exit 1
          fi
          ssh-keygen -y -f ~/.ssh/deploy_key > /tmp/deploy.pub
          echo "Deploy key fingerprint:"
          ssh-keygen -lf /tmp/deploy.pub
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload image and compose
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" 'mkdir -p /tmp/go-demo-deploy "$HOME/GO-Demo"'
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            go-demo.tar docker-compose.yml \
            "$USER@$HOST:/tmp/go-demo-deploy/"

      - name: Load image and restart
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$USER@$HOST" 'bash -s' <<'EOF'
          set -euo pipefail
          sudo docker load -i /tmp/go-demo-deploy/go-demo.tar
          cp /tmp/go-demo-deploy/docker-compose.yml "$HOME/GO-Demo/docker-compose.yml"
          cd "$HOME/GO-Demo"
          test -f .env || { echo "missing ~/GO-Demo/.env"; exit 1; }
          sudo docker compose --profile api up -d
          sudo docker ps --filter name=awesome-api --format '{{.Names}} {{.Image}} {{.Status}}'
          curl -fsS -H 'Host: app.persicatao.top' http://127.0.0.1/health
          rm -f /tmp/go-demo-deploy/go-demo.tar
          EOF
