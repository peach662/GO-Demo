# 不要在本机执行 docker compose up。
# MySQL 已经在服务器容器 mysql-33603 里运行，主机端口是 33603。
# 应用连接串写在 .env.example 的 MYSQL_DSN。没有 .env 时，程序会读取 .env.example。
# 这个服务带了 profile，普通 docker compose up 不会启动它，避免再创建一个 MySQL。
services:
  mysql:
    image: mysql:8.0
    container_name: mysql-33603
    profiles: ["manual"]
    restart: unless-stopped
    ports:
      - "33603:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
